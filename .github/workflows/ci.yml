name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: db_user
          POSTGRES_PASSWORD: db_password
          POSTGRES_DB: db_name
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U db_user -d db_name"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=db_name;Username=db_user;Password=db_password

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build .NET tests and API
        run: dotnet build tests/SelfBudget.Tests/SelfBudget.Tests.csproj --configuration Release

      - name: Run .NET tests
        run: dotnet test tests/SelfBudget.Tests/SelfBudget.Tests.csproj --configuration Release --no-build

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
